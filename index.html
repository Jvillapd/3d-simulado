<meta name="theme-color" content="#0e151b">
<title>NClub · Experiencia VIP inmersiva</title>
<style>
:root{color-scheme:dark;--bg:#0e151b;--panel:rgba(14,22,28,.9);--gold:#e3bf85;--line:#c9a46a;--cream:#f7ebd7;--muted:#b9b4aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font:15px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none}
button{font:inherit;cursor:pointer;border:1px solid #c9a46a66;border-radius:10px;background:#22313a;color:var(--cream);padding:10px 14px;min-height:42px}
button:hover{background:#2f434d}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:linear-gradient(#d1a868,#b28b54);color:#162028;border-color:#f0d29e;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 30%,rgba(20,32,40,.45),rgba(8,12,16,.9));z-index:20;overflow:auto}
#overlay.hidden{display:none}
.card{width:min(560px,100%);background:var(--panel);border:1px solid #c9a46a55;border-radius:18px;padding:24px;box-shadow:0 20px 60px #000a;backdrop-filter:blur(14px)}
.brand strong{font:600 38px Georgia,serif;letter-spacing:6px;color:var(--gold)}
.brand small{display:block;font-size:12px;letter-spacing:2.5px;color:#cbbca6}
.card p{color:#e2d8c8}
.langs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.langs button.on{background:#765b39;border-color:var(--gold)}
.cta{display:grid;gap:10px;margin:16px 0 8px}
.cta button{font-size:17px;min-height:52px}
#xrStatus{font-size:13px;color:var(--muted);min-height:20px}
details{margin-top:10px;font-size:13px;color:#d8cfc0}
summary{cursor:pointer;color:var(--gold)}
details ul{padding-left:18px;margin:6px 0 4px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud.hidden{display:none}
.hudTop{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.chip{background:rgba(12,20,26,.78);border:1px solid #c9a46a55;border-radius:12px;padding:8px 12px;backdrop-filter:blur(10px)}
.chip strong{font:600 18px Georgia,serif;letter-spacing:3px;color:var(--gold);margin-right:8px}
#zoneBadge{font-size:12px;letter-spacing:1px;color:#f2dfbd}
.hudBtns{display:flex;gap:8px;pointer-events:auto}
.hudBtns button{min-height:36px;padding:6px 12px;background:rgba(18,30,38,.85)}
#crosshair{position:absolute;top:50%;left:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border:1.5px solid #f8e0b8;border-radius:50%;opacity:.75}
#help{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);text-align:center;font-size:12px;color:#ead9c3;text-shadow:0 1px 4px #000;background:rgba(10,16,20,.55);padding:6px 12px;border-radius:10px}
#joy{position:absolute;left:22px;bottom:40px;width:120px;height:120px;border-radius:50%;border:1px solid #c9a46a88;background:rgba(14,22,28,.45);pointer-events:auto;touch-action:none;display:none}
#joy span{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(227,191,133,.6)}
@media (pointer:coarse){#joy{display:block}#crosshair,#help{display:none}}
#loadError{display:none;position:fixed;z-index:99;inset:auto 12px 12px 12px;max-width:650px;margin:auto;padding:18px;border-radius:12px;background:#241a19;color:#fff0db;border:1px solid #dba46f;box-shadow:0 8px 24px #0008}
</style>
</head>

<div id="app"></div>

<div id="hud" class="hidden">
  <div class="hudTop">
    <div class="chip"><strong>NCLUB</strong><span id="zoneBadge"></span></div>
    <div class="hudBtns"><button id="hudMenu"></button><button id="hudAssistant"></button><button id="hudVR" hidden>VR</button></div>
  </div>
  <div id="crosshair"></div>
  <div id="help"></div>
  <div id="joy"><span></span></div>
</div>

<div id="overlay">

<div id="loadError" role="alert"><strong>No se pudo iniciar la vista 3D.</strong><p id="loadErrorDetails"></p><p>Abre el sitio publicado por HTTPS (GitHub Pages, Vercel o Netlify) con conexión a Internet y verifica que <code>cdn.jsdelivr.net</code> no esté bloqueado.</p><button onclick="location.reload()">Reintentar</button></div>

<script>
(function () {
  var shown = false;
  function fail(msg) {
    if (window.__nclubBooted || shown) return;
    shown = true;
    document.getElementById('loadError').style.display = 'block';
    document.getElementById('loadErrorDetails').textContent = msg;
  }
  window.__nclubFail = fail;
  window.addEventListener('error', function (e) {
    var el = e.target;
    if (el && el.tagName === 'SCRIPT') { fail('No se pudo descargar una librería 3D (' + (el.src || 'módulo') + ').'); return; }
    if (e.message) fail(e.message);
  }, true);
  window.addEventListener('unhandledrejection', function (e) { fail(String((e.reason && e.reason.message) || e.reason)); });
  setTimeout(function () { if (!window.__nclubBooted) fail('La escena tardó demasiado en cargar. Revisa tu conexión.'); }, 30000);
})();
</script>

  box(M.wood, x, 0.45, z, along ? 0.55 : 1.8, 0.08, along ? 1.8 : 0.55);
  const bx = along ? -Math.sign(Math.sin(ry)) * 0.25 : 0, bz = along ? 0 : -Math.sign(Math.cos(ry)) * 0.25;

function buildTreesAndLamps() {
  for (const z of [34, 28, 9]) { for (const x of [-6, 6]) tree(x, z, 0.95); lamp(-3.1, z); lamp(3.1, z); }
  for (let x = 11; x <= 18; x += 5) { lamp(x, -6.1); lamp(-x, -6.1); }
  // keep-clear zones for random trees
  const clear = [[-9, 9, 11, 25], [-15, 15, -15, 7], [17, 37, -12, 4], [-35, -14, -14, 6], [24, 38, 19, 31], [-11, 11, -39, -19],
    [23, 42, -45, -19], [-31, -20, -40, -24], [-16, 16, 27, 36]];
  const nearPath = (x, z) => pathSegs.some(p => {
    const dx = p.x2 - p.x1, dz = p.z2 - p.z1, l2 = dx * dx + dz * dz, k = clamp(((x - p.x1) * dx + (z - p.z1) * dz) / l2, 0, 1);
    return Math.hypot(x - (p.x1 + dx * k), z - (p.z1 + dz * k)) < p.w / 2 + 2;
  });
  let placed = 0;
  for (let i = 0; i < 1400 && placed < 110; i++) {
    const x = lerp(BOUNDS.x0 + 2, BOUNDS.x1 - 2, rand()), z = lerp(BOUNDS.z0 + 2, BOUNDS.z1 - 2, rand());
    if (clear.some(([a, b, c, d]) => x > a && x < b && z > c && z < d) || nearPath(x, z)) continue;
    if (colliders.some(c => c.type === 'box' ? (x > c.minX - 2.5 && x < c.maxX + 2.5 && z > c.minZ - 2.5 && z < c.maxZ + 2.5) : Math.hypot(x - c.x, z - c.z) < c.r + 2.5)) continue;
    tree(x, z, 0.85 + rand() * 0.45); placed++;
  }
  // scenery beyond the hedge: forest ring, lake and hills (no collisions needed)
  for (let i = 0; i < 160; i++) {
    const a = rand() * TAU, r = 70 + rand() * 60, x = 1 + Math.cos(a) * r * 1.1, z = -8 + Math.sin(a) * r;
    if (Math.hypot(x + 74, z + 8) < 24) continue;
    tree(x, z, 1 + rand() * 0.8, false);
  }
  addStatic(G.disc, M.water, -74, 0.03, -8, 26, 1, 15, { shadow: false });
  for (let i = 0; i < 40; i++) { const a = i / 40 * TAU; addStatic(G.ico, M.stone, -74 + Math.cos(a) * 26.3, 0.1, -8 + Math.sin(a) * 15.3, 0.4, 0.25, 0.4); }
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * TAU + rand() * 0.2, r = 190 + rand() * 80;
    addStatic(G.cone, M.hill[i % 3], Math.cos(a) * r, 0, Math.sin(a) * r, 50 + rand() * 50, 16 + rand() * 22, 50 + rand() * 50, { shadow: false });
  }
}

const items = [];

function addItem(def) {

  world.addBody(body);
  const mats = [];
  def.object.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true;
    if (o.material.emissive) { o.material = o.material.clone(); o.material.userData.e0 = o.material.emissive.getHex(); mats.push(o.material); }
  });
  scene.add(def.object);
  const item = { ...def, body, mats, home: { pos: body.position.clone(), quat: body.quaternion.clone() }, held: null, hl: false, pull: 1,
    vel: new THREE.Vector3(), angVel: new THREE.Vector3(), prevPos: new THREE.Vector3(), prevQuat: new THREE.Quaternion(), lastSound: 0, lastKick: 0, sinking: 0 };

    const v = Math.abs(e.contact.getImpactVelocityAlongNormal()), now = performance.now();
    if (v > 0.7 && now - item.lastSound > 90) { item.lastSound = now; sfx.bounce(v, item.kind); }

}
let xrStatusKey = 'vrChecking';
function refreshTexts() {
  document.documentElement.lang = settings.lang;
  $('ovIntro').textContent = t('intro');
  $('btnVR').textContent = t('enterVR');
  $('btnDesk').textContent = started ? t('resume') : t('explore');
  $('xrStatus').textContent = t(xrStatusKey);
  $('ctlVRTitle').textContent = t('controlsVR');
  $('ctlDeskTitle').textContent = t('controlsDesk');
  $('ctlVR').replaceChildren(...t('ctlVR').map(s => Object.assign(document.createElement('li'), { textContent: s })));
  $('ctlDesk').replaceChildren(...t('ctlDesk').map(s => Object.assign(document.createElement('li'), { textContent: s })));
  $('help').textContent = t('deskHelp');
  $('hudMenu').textContent = t('hudMenu');
  $('hudAssistant').textContent = t('hudAssistant');
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.lang === settings.lang));
  $('zoneBadge').textContent = locationLabel();
  signs.forEach(drawSign);
  panels.forEach(p => { p.dirty = true; });
}
function setLang(l) {
  settings.lang = l; saveSettings(); ui.message = ''; refreshTexts();
  if (started) speak(t('assistantShort'));
}
function placePlayerAtSpawn() {
  player.vel.set(0, 0, 0); player.vy = 0; player.feetY = 0; player.stepOffset = 0; player.onGround = true; player.pitch = 0; player.yaw = SPAWN.yaw;
  if (xrActive) {
    rig.updateMatrixWorld(true);
    rotateRig(angDiff(SPAWN.yaw, head.yaw));
    const hw = headWorld(_v);
    rig.position.x += SPAWN.x - hw.x; rig.position.z += SPAWN.z - hw.z; rig.position.y = settings.seated ? SEAT_OFFSET : 0;
  } else { rig.position.set(SPAWN.x, 0, SPAWN.z); rig.rotation.y = SPAWN.yaw; }
}
function resetExperience() {
  endGuide();
  if (deskHeld) releaseItem(deskHeld);
  hands.forEach(h => h.held && releaseItem(h.held));
  for (const r of robots) { r.stopAt(r.home.x, r.home.z); r.yaw = r.faceYaw = r.homeYaw; r.greeted = false; r.greetCount = 0; r.returnAt = 0; }
  for (const it of [...items]) it.kind === 'served' ? removeItem(it) : respawn(it);
  for (const k in cart) delete cart[k];
  golf.strokes = 0;
  ui.page = 'main'; ui.message = '';
  closeAssistant(); closeMenu();
  placePlayerAtSpawn();
  showToast(t('resetMsg'));
}

// ============================================================================
// Input wiring
// ============================================================================
const canvas = renderer.domElement;
const overlayOpen = () => !$('overlay').classList.contains('hidden');
function deskClick(scr) {
  if (scr) mouse.x = scr.x, mouse.y = scr.y, mouse.has = true;
  const { o, d } = desktopRay(), hit = pointerQuery(o, d);
  if (hit?.kind === 'panel') { if (hit.btn) { hit.panel.press(hit.btn); sfx.click(); } return true; }
  if (deskHeld) {
    if (deskHeld.kind === 'putter') { if (deskSwing < 0) deskSwing = 0; }
    else { releaseItem(deskHeld, d.multiplyScalar(7.5)); sfx.whoosh(); }
    return true;
  }
  if (hit?.kind === 'robot') { talkTo(hit.robot); return true; }
  if (hit?.kind === 'item' && hit.distance < 3.6) { grabItem(hit.item, { type: 'desk' }); return true; }
  return false;
}
function deskGrabToggle() {
  if (deskHeld) { releaseItem(deskHeld); return; }
  const { o, d } = desktopRay(), hit = pointerQuery(o, d);
  if (hit?.kind === 'item' && hit.distance < 3.6) grabItem(hit.item, { type: 'desk' });
}
const ptr = { id: null, x: 0, y: 0, moved: 0, type: 'mouse', button: 0 };
canvas.addEventListener('pointerdown', e => {
  if (xrActive || !started) return;
  sfx.init();
  if (document.pointerLockElement === canvas) { if (e.button === 0) deskClick(null); else if (e.button === 2 && deskHeld) releaseItem(deskHeld); return; }
  Object.assign(ptr, { id: e.pointerId, x: e.clientX, y: e.clientY, moved: 0, type: e.pointerType, button: e.button });
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (document.pointerLockElement === canvas) {
    player.yaw -= e.movementX * 0.0022;
    player.pitch = clamp(player.pitch - e.movementY * 0.0022, -1.35, 1.35);
    return;
  }
  if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; mouse.has = true; }
  if (ptr.id !== e.pointerId) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.moved += Math.abs(dx) + Math.abs(dy);
  if (ptr.moved > 6) {
    const k = ptr.type === 'touch' ? 0.005 : 0.0035;
    player.yaw -= dx * k; player.pitch = clamp(player.pitch - dy * k, -1.35, 1.35);
    guide.autoWalk = guide.autoWalk && ptr.type !== 'touch';
  }
});
canvas.addEventListener('pointerup', e => {
  if (ptr.id !== e.pointerId) return;
  ptr.id = null;
  if (ptr.moved > 6) return;
  if (ptr.button === 2) { if (deskHeld) releaseItem(deskHeld); return; }
  const handled = deskClick({ x: e.clientX, y: e.clientY });
  if (!handled && ptr.type === 'mouse') canvas.requestPointerLock?.();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (overlayOpen() || xrActive) return;
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space' || e.code === 'Tab') e.preventDefault();
  if (e.repeat) return;
  sfx.init();
  switch (e.code) {
    case 'Space': jumpReq = true; break;
    case 'KeyE': deskGrabToggle(); break;
    case 'KeyQ': toggleAssistant(); break;
    case 'KeyM': case 'Tab': toggleMenu(); break;
    case 'KeyT': hopRoute(); break;
    case 'KeyG': if (guide.active) { guide.autoWalk = !guide.autoWalk; guide.delay = 0; } break;
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
{
  const el = $('joy'), knob = el.firstElementChild;
  const move = e => {
    const r = el.getBoundingClientRect();
    let x = (e.clientX - r.left - r.width / 2) / (r.width / 2), y = (e.clientY - r.top - r.height / 2) / (r.height / 2);
    const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    joy.x = x; joy.y = y; knob.style.transform = `translate(${x * 35}px,${y * 35}px)`;
  };
  el.addEventListener('pointerdown', e => { joy.id = e.pointerId; el.setPointerCapture(e.pointerId); move(e); sfx.init(); });
  el.addEventListener('pointermove', e => { if (e.pointerId === joy.id) move(e); });
  const end = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
$('hudMenu').addEventListener('click', () => { sfx.init(); toggleMenu(); });
$('hudAssistant').addEventListener('click', () => { sfx.init(); toggleAssistant(); });
$('hudVR').addEventListener('click', enterVR);
document.querySelectorAll('#langs button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('btnDesk').addEventListener('click', () => { sfx.init(); startExperience(); });
$('btnVR').addEventListener('click', enterVR);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

function startExperience() {
  $('overlay').classList.add('hidden');
  $('hud').classList.toggle('hidden', xrActive);
  if (!started) { started = true; showToast(t('welcome')); refreshTexts(); }
}
async function enterVR() {
  sfx.init();
  if (!navigator.xr) return;
  const opts = { requiredFeatures: ['local-floor'], optionalFeatures: ['bounded-floor', 'hand-tracking'] };
  try {
    let session;
    try { session = await navigator.xr.requestSession('immersive-vr', opts); }
    catch { session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] }); }
    await renderer.xr.setSession(session);
  } catch (e) { $('xrStatus').textContent = t('vrFail', e.message || e); }
}
renderer.xr.addEventListener('sessionstart', () => {
  xrActive = true;
  document.exitPointerLock?.();
  rig.rotation.y = player.yaw;
  camera.position.set(0, 0, 0); camera.quaternion.identity();
  rig.position.y = player.feetY + (settings.seated ? SEAT_OFFSET : 0);
  sun.shadow.mapSize.set(1024, 1024); sun.shadow.map?.dispose(); sun.shadow.map = null;
  recenterPanels(); closeMenu();
  startExperience();
  showToast(t('welcome'));
});
renderer.xr.addEventListener('sessionend', () => {
  xrActive = false;
  hands.forEach(h => { if (h.held) releaseItem(h.held); h.teleporting = false; h.cursor.visible = false; });
  hideArc();
  player.yaw = head.yaw; player.pitch = 0;
  rig.rotation.y = player.yaw; rig.position.set(head.pos.x, player.feetY, head.pos.z);
  camera.position.set(0, EYE, 0); camera.quaternion.identity(); camera.rotation.set(0, 0, 0);
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.map?.dispose(); sun.shadow.map = null;
  recenterPanels();
  $('btnDesk').textContent = t('resume');
  $('overlay').classList.remove('hidden');
  $('hud').classList.add('hidden');
});
async function checkXR() {
  if (!window.isSecureContext) xrStatusKey = 'vrNoHttps';
  else if (!navigator.xr) xrStatusKey = 'vrNoXR';

    try {

}

// ============================================================================
// Main loop
// ============================================================================
const clock = new THREE.Clock();
const _fwd = new THREE.Vector3();
function updateHead() {
  rig.updateMatrixWorld(true);
  if (xrActive) renderer.xr.updateCamera(camera);
  camera.getWorldPosition(head.pos);
  camera.getWorldDirection(_fwd);
  head.yaw = xrActive ? Math.atan2(-_fwd.x, -_fwd.z) : player.yaw;
}
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), now = clock.elapsedTime;
  updateHead();
  if (started) { if (xrActive) updateXRInput(dt); else updateDesktop(dt); }
  updateHead();
  updateHeld(dt);
  world.step(1 / 120, dt, 6);
  updateItems(now);
  for (const r of robots) r.update(dt, now);
  updateGuide(dt, now);
  ribbon.update(dt);
  beacon.update(now);
  updateFade(dt);
  updatePointers();
  greetings();
  updatePanels(dt);
  animateWorld(now, dt);
  updateSun();
  sfx.update(dt, head.pos, _fwd);
  hudTick(dt);
  renderer.render(scene, camera);
});

placePlayerAtSpawn();
refreshTexts();
checkXR();
window.__nclubBooted = true;
window.__nclub = { renderer, scene, camera, rig, player, robots, items, guide, startGuide, jumpToDestination, ZONES, findPath, colliders, settings, assistant, menuPanel, toast, ui, cart, hands, golf, deskClick, grabItem, releaseItem, setLang, isXR: () => xrActive };
